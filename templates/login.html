{% extends "base.html" %}
{% block title %}Login – SmartGram Pro{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-city"></i></div>
            <h2>Welcome Back</h2>
            <p>Sign in to access SmartGram Pro</p>
          </div>
          <form method="POST" action="{{ url_for('login') }}" id="loginForm">
            <div class="mb-4">
              <label class="form-label fw-600">Username</label>
              <div class="input-group-custom">
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="form-control custom-input" name="username"
                       id="username" placeholder="Enter your username" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-600">Password</label>
              <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="form-control custom-input" name="password"
                       id="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('password')">
                  <i class="fas fa-eye" id="password-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-auth-primary w-100">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
          </form>
          <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
          </div>
          <!-- Demo credentials hint -->
          <div class="demo-hint mt-3 p-3 rounded">
            <small><i class="fas fa-info-circle me-1 text-info"></i>
              <strong>Admin Demo:</strong> username: <code>admin</code> | password: <code>admin123</code>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
